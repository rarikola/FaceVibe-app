name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FaceVibe-clean-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: |
          gradle assembleDebug --no-daemon 2>&1 | tee /tmp/b.log; s=${PIPESTATUS[0]}
          grep -v -E "^\s*$|^> Task|^Download|deprecat" /tmp/b.log | tail -25 | while IFS= read -r l; do echo "::error::$l"; done
          exit $s
      - uses: actions/upload-artifact@v4
        with:
          name: FaceVibe-debug-apk
          path: FaceVibe-clean-project/app/build/outputs/apk/debug/app-debug.apk
